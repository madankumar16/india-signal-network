name: Refresh IODA snapshot

on:
  schedule:
    - cron: "37 0 * * *"   # daily at 00:37 UTC (06:07 IST); GitHub may delay scheduled runs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-ioda
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/refresh_ioda.py
      - name: Commit and push the daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ioda.json index.html
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "chore(data): refresh IODA outage snapshot"
          git pull --rebase
          git push
