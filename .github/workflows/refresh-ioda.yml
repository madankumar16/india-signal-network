name: Refresh IODA snapshot

on:
  schedule:
    - cron: "37 0 * * *"   # daily at 00:37 UTC (06:07 IST); GitHub may delay scheduled runs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-ioda
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/refresh_ioda.py
      - name: Commit and push if the outage data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ioda.json index.html
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          # Skip the commit when only updatedAt moved and the per-state outage
          # data is identical to the committed snapshot. Any error in this
          # check (e.g. no committed ioda.json) falls through to a commit.
          if python - <<'PY'
          import json, subprocess, sys
          try:
              old = json.loads(subprocess.run(["git", "show", "HEAD:ioda.json"], capture_output=True,
                                              text=True, encoding="utf-8", check=True).stdout)
              with open("ioda.json", encoding="utf-8") as f:
                  new = json.load(f)
          except Exception as exc:
              print(f"Could not compare snapshots ({exc}); committing")
              sys.exit(1)
          same = {k: v for k, v in old.items() if k != "updatedAt"} == {k: v for k, v in new.items() if k != "updatedAt"}
          sys.exit(0 if same else 1)
          PY
          then
            echo "Only the timestamp changed; nothing to commit"
            exit 0
          fi
          git commit -m "chore(data): refresh IODA outage snapshot"
          git pull --rebase
          git push
